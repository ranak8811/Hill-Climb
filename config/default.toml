# Default configuration for Hill Climb Gesture Controller

[camera]
index = 0
width = 640
height = 480
fps = 30
mirror = true

[tracking]
max_num_hands = 1
min_detection_confidence = 0.7
min_tracking_confidence = 0.5
model_path = "models/hand_landmarker.task"

[gestures]
# Gesture stability / debouncing
debounce_frames = 3
tracking_loss_timeout = 0.5

# Gesture-to-key mappings
# Hill Climb Racing (https://hill-climb-racing.com/hill-climb-racing-games/hill-climb-race) controls:
# Open Palm = Gas / Accelerate (Right Arrow), Fist = Brake / Reverse (Left Arrow)
[key_mapping]
open_palm = "accelerate"
fist = "brake"
index_up = "neutral"

[actions]
neutral = ""
accelerate = "right"
brake = "left"

[ui]
show_preview = true
show_landmarks = true
preview_window_name = "Hill Climb - Gesture Preview"
