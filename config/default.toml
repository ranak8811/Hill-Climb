# Default configuration for Hill Climb Gesture Controller

[camera]
index = 0
width = 640
height = 480
fps = 30
mirror = true

[tracking]
max_num_hands = 1
min_detection_confidence = 0.7
min_tracking_confidence = 0.5

[gestures]
# Gesture stability / debouncing
debounce_frames = 3
tracking_loss_timeout = 0.5

# Gesture-to-key mappings
# Hill Climb Racing default web keys: W/Up for accelerate, S/Down for brake/reverse
[key_mapping]
open_palm = "neutral"
index_up = "accelerate"
fist = "brake"

[actions]
neutral = ""
accelerate = "w"
brake = "s"

[ui]
show_preview = true
show_landmarks = true
preview_window_name = "Hill Climb - Gesture Preview"
