[project]
name = "hill-climb"
version = "0.1.0"
description = "AI-powered hand gesture controller for Hill Climb Racing on macOS"
readme = "README.md"
authors = [
    { name = "Anwar_Hossain", email = "ranakrphone@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.1.1",
    "opencv-python>=5.0.0.93",
    "pynput>=1.8.2",
]

[project.scripts]
hill-climb = "hill_climb.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
